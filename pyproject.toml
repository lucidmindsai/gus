[tool.poetry]
name = "greenurbanscenarios"
version = "2.3.0"
description = "Green Unified Scenarios - A digital twin representation, simulation of urban forests and their impact analysis. -- An updated version of the GUS ABM simulation service, rewritten for performance"
authors = ["Bulent Ozel <bulent@lucidminds.ai>", "jake <jake@lucidminds.ai>"]
maintainers = [
    "Oguzhan Yayla <oguzhan@lucidminds.ai>", 
    "Marko Petrovic <marko@lucidminds.ai>", 
    "Axel Nilsson <axel@darkmatterlabs.org>"
]
license = "Apache License 2.0"
readme = "README-pypi.md"
classifiers = [
    "Development Status :: 4 - Beta",
    'Environment :: Console',
    'Operating System :: OS Independent',
    'Intended Audience :: Developers',
    'License :: Other/Proprietary License',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3 :: Only',
    'Topic :: Software Development :: Libraries',
    'Topic :: Software Development :: Libraries :: Python Modules',
    'Topic :: Utilities'
]
packages = [
    {include = "pygus"},
]

[tool.poetry.dependencies]
python = "^3.12"
mesa = {extras = ["rec"], version = "^3.1.2"}
pandas = "^2.2.3"
fuzzywuzzy = "^0.18.0"
python-levenshtein = "^0.26.1"
utm = "^0.7.0"
scikit-learn = "^1.6.0"
shapely = "^2.0.6"
numpy = "^2.2.1"


[tool.poetry.group.dev.dependencies]
matplotlib = "^3.10.0"
seaborn = "^0.13.2"
pdoc3 = "^0.11.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
